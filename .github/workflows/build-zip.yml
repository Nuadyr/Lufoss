name: Build from zip

on:
  workflow_dispatch:
  push:
    paths: ["source/Lufoss.zip"]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q source/Lufoss.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - run: gradle ktlintCheck --console=plain
        working-directory: work/Lufoss

  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q source/Lufoss.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - run: gradle testDebugUnitTest assembleDebug --console=plain
        working-directory: work/Lufoss
      - uses: actions/upload-artifact@v4
        with:
          name: Lufoss-debug-apk
          path: work/Lufoss/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
