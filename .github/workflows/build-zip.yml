name: Unpack and build

on:
  workflow_dispatch:
  push:
    paths: ["source/Lufoss.zip"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0"
  JAVA_VERSION: "17"

jobs:
  unpack:
    name: Unpack zip into repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Unpack
        run: |
          if [ -f source/Lufoss.zip ]; then
            unzip -q source/Lufoss.zip -d /tmp/unz
            rsync -a --exclude='.github/workflows' /tmp/unz/Lufoss/ ./
            git rm -q source/Lufoss.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack Lufoss project from zip"
            git push
          else
            echo "No zip found, building what is already in the repo."
          fi

  build:
    name: ktlint, test and build
    needs: unpack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Step 1: auto-fix what ktlint can fix, and save the fixes to the repo.
      - name: ktlint auto-fix
        continue-on-error: true
        run: gradle ktlintFormat --console=plain

      - name: Commit ktlint fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply ktlint fixes"
            git push
          else
            echo "ktlint had nothing to fix."
          fi

      # Step 2: strict check. If anything is left, the build stops here.
      - name: ktlint check
        run: gradle ktlintCheck --console=plain

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/**"
          retention-days: 7

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LUFOSS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured, so the release APK will be unsigned."
          fi

      - name: Unit tests and release APK
        env:
          LUFOSS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUFOSS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUFOSS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --console=plain

      - name: Verify the APK signature
        if: env.LUFOSS_KEYSTORE_FILE != ''
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Lufoss-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
