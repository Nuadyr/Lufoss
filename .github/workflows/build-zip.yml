name: Unpack and build

on:
  workflow_dispatch:
  push:
    paths: ["source/Lufoss.zip"]

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  unpack:
    name: Unpack zip into repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Unpack
        run: |
          if [ -f source/Lufoss.zip ]; then
            unzip -q source/Lufoss.zip -d /tmp/unz
            rsync -a --exclude='.github/workflows' /tmp/unz/Lufoss/ ./
            git rm -q source/Lufoss.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack Lufoss project from zip"
            git push
          else
            echo "No zip found, building what is already in the repo."
          fi

  build:
    name: ktlint, test and build
    needs: unpack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Step 1: auto-fix what ktlint can fix, and save the fixes to the repo.
      - name: ktlint auto-fix
        continue-on-error: true
        run: gradle ktlintFormat --console=plain

      - name: Commit ktlint fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply ktlint fixes"
            git push
          else
            echo "ktlint had nothing to fix."
          fi

      # Step 2: strict check. If anything is left, the build stops here.
      - name: ktlint check
        run: gradle ktlintCheck --console=plain

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/**"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests and debug APK
        run: gradle testDebugUnitTest assembleDebug --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: Lufoss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
