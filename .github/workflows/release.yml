name: Release

# Builds a signed APK and publishes it as a GitHub release.
#
# Two ways to run it:
#   1. Push a version tag, for example v1.0.1 (it must match versionName in app/build.gradle.kts).
#   2. Actions > Release > Run workflow, and type an existing tag such as v1.0.0.
#
# Needs these repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match versionName $version in app/build.gradle.kts." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret $name. A release must be signed." >&2
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LUFOSS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Style check and unit tests
        run: gradle ktlintCheck testReleaseUnitTest --console=plain

      - name: Build signed release APK
        env:
          LUFOSS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUFOSS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUFOSS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --console=plain

      - name: Verify the signature and name the files
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/Lufoss-$VERSION.apk"
          (cd dist && sha256sum "Lufoss-$VERSION.apk" > "Lufoss-$VERSION.apk.sha256")
          cat "dist/Lufoss-$VERSION.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/Lufoss-$VERSION.apk" "dist/Lufoss-$VERSION.apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Lufoss $VERSION" --generate-notes
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
