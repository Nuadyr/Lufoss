name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ktlint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: ktlint check
        run: gradle ktlintCheck --console=plain

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LUFOSS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured, so the release APK will be unsigned."
          fi

      - name: Unit tests
        run: gradle testReleaseUnitTest --console=plain

      - name: Build release APK
        env:
          LUFOSS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUFOSS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUFOSS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --console=plain

      - name: Verify the APK signature
        if: env.LUFOSS_KEYSTORE_FILE != ''
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: Lufoss-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/**"
          if-no-files-found: ignore

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
